# ============================================================
# Russian Telegram OSINT — Channel Configuration
# ============================================================
# For a Nordic-facing OSINT aggregator (RU/UK/BY → EN)
#
# FIELDS:
#   handle          — the t.me/<handle> slug (without @)
#   name_ru         — native-language name
#   name_en         — English transliteration or name
#   url             — scraping URL (t.me/s/ gives public HTML preview)
#   category        — see category list below
#   language        — ru / uk / by / en
#   stance          — pro_kremlin / mixed / independent / opposition /
#                     pro_ukraine / pro_belarus_opposition
#   priority        — tier_1 (must-have), tier_2 (strong recommend),
#                     tier_3 (nice-to-have)
#   source_type     — official / wire / tabloid / milblogger / pmc /
#                     independent_media / opposition_politician /
#                     elite_analytical / business / government / propagandist
#   notes           — editorial note for the classification layer
#   in_original_list — true if in Dimmu's screenshot, false if added
#   verify          — true = I'm less certain of the handle; confirm at
#                     t.me/s/<handle> before production use
#
# CATEGORIES:
#   state_media          — TASS, RIA, RT etc. Institutional Kremlin baseline
#   kremlin_official     — Ministries, spokespeople, Medvedev, Kadyrov
#   propagandist         — Personality-driven propaganda (Solovyov, Simonyan)
#   milblogger_frontline — Embedded/combat reporters physically near the front
#   milblogger_analytical— Commentary, maps, tactical summaries from distance
#   pmc                  — Wagner / private military company adjacent
#   nationalist          — Ultranationalist / ideological (Tsargrad, Malofeev)
#   tabloid              — Baza / SHOT / Mash-type breaking news
#   exile_independent    — Meduza, The Insider, etc.
#   opposition           — Navalny team, Schulmann, Katz
#   elite_analytical     — Nezygar-type anonymous insider channels
#   business             — Russian economic / financial coverage
#   ukrainian            — Ukrainian-side for reaction/context
#   belarusian           — Belarus security (direct Nordic interest)
#
# Last updated: 2026-04-21
# ============================================================


